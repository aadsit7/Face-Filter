function navigate(p){window.location.hash=p}
function NavLink({to,end,children,onClick,className:cn}){const h=useHash();const clean=to.replace('#','');const isActive=end?h===clean:h===clean||h.startsWith(clean+'/');const cls=typeof cn==='function'?cn({isActive}):cn;return <a href={'#'+clean} onClick={e=>{if(onClick)onClick(e)}} className={cls}>{children}</a>}

function Card({children,className='',title,subtitle,headerAction}){return <div className={`bg-white rounded-xl shadow-sm border border-recast-gray-200 ${className}`}>{title&&<div className="flex items-center justify-between p-5 border-b border-recast-gray-200"><div><h3 className="font-semibold text-recast-navy">{title}</h3>{subtitle&&<p className="text-sm text-recast-gray-500 mt-0.5">{subtitle}</p>}</div>{headerAction}</div>}<div className="p-5">{children}</div></div>}
function Badge({children,variant='default',size='sm'}){const v={default:'bg-recast-gray-100 text-recast-gray-700',success:'bg-green-100 text-green-700',warning:'bg-amber-100 text-amber-700',danger:'bg-red-100 text-red-700',info:'bg-cyan-100 text-cyan-700',purple:'bg-purple-100 text-purple-700'};const s=size==='sm'?'text-xs px-2 py-0.5':'text-sm px-3 py-1';return <span className={`inline-flex items-center rounded-full font-medium ${v[variant]||v.default} ${s}`}>{children}</span>}
function Button({children,variant='primary',size='md',onClick,disabled,type='button',className=''}){const v={primary:'bg-recast-navy text-white hover:bg-recast-navy-light',secondary:'border border-recast-gray-300 text-recast-gray-700 hover:bg-recast-gray-50',danger:'bg-recast-red text-white hover:opacity-90',ghost:'text-recast-gray-600 hover:bg-recast-gray-100'};const s={sm:'text-sm px-3 py-1.5',md:'text-sm px-4 py-2',lg:'text-base px-6 py-3'};return <button type={type} onClick={onClick} disabled={disabled} className={`rounded-lg font-medium transition-colors disabled:opacity-50 ${v[variant]} ${s[size]} ${className}`}>{children}</button>}
function ProgressBar({value=0,color='navy',size='md',showLabel}){const c={navy:'bg-recast-navy',green:'bg-recast-green',cyan:'bg-recast-cyan',orange:'bg-recast-orange'};const h=size==='sm'?'h-2':'h-3';const v=Math.min(100,Math.max(0,value));return <div className="flex items-center gap-3"><div className={`flex-1 bg-recast-gray-200 rounded-full ${h}`}><div className={`${c[color]} rounded-full ${h} transition-all`} style={{width:v+'%'}}/></div>{showLabel&&<span className="text-sm font-medium text-recast-gray-700">{v}%</span>}</div>}
function StatCard({label,value,change,changeType='neutral',icon}){const ct={positive:'text-recast-green',negative:'text-recast-red',neutral:'text-recast-gray-500'};return <div className="bg-white rounded-xl shadow-sm border border-recast-gray-200 p-5">{icon&&<div className="flex items-center justify-center w-10 h-10 rounded-full bg-recast-navy/10 text-recast-navy mb-4">{icon}</div>}<p className="text-2xl font-bold text-recast-navy">{value}</p><p className="text-sm text-recast-gray-500 mt-1">{label}</p>{change&&<p className={`text-sm mt-2 font-medium ${ct[changeType]}`}>{change}</p>}</div>}

s=['Playbooks','Battle Cards','Objections'];return <div className="space-y-6"><div><h1 className="text-2xl font-bold text-recast-navy">Sales Playbooks</h1><p className="text-recast-gray-500 mt-1">Playbooks, battle cards, and objection handling.</p></div><div className="flex gap-4 border-b border-recast-gray-200">{tabs.map(t=><button key={t} onClick={()=>setTab(t)} className={`pb-3 text-sm font-medium border-b-2 transition-colors ${tab===t?'border-recast-navy text-recast-navy':'border-transparent text-recast-gray-500 hover:text-recast-gray-700'}`}>{t}</button>)}</div>{tab==='Playbooks'&&<div className="space-y-4"><SearchInput value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search playbooks..."/><div className="grid grid-cols-1 md:grid-cols-2 gap-4">{filtered.map(pb=><div key={pb.id} onClick={()=>setSelectedId(pb.id)} className="cursor-pointer"><Card className="hover:shadow-md transition-shadow h-full"><Badge variant={prodColor[pb.product]} size="sm">{pb.product}</Badge><h3 className="text-lg font-semibold text-recast-navy mt-2">{pb.title}</h3><p className="text-sm text-recast-gray-600 mt-1 line-clamp-2">{pb.description}</p><div className="flex flex-wrap gap-1 mt-3">{pb.targetPersonas.slice(0,3).map((p,i)=><Badge key={i} size="sm">{p}</Badge>)}</div></Card></div>)}</div></div>}{tab==='Battle Cards'&&<div className="space-y-6">{battleCards.map(bc=><Card key={bc.id} title={`vs. ${bc.competitor}`}><div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div className="bg-red-50 rounded-lg p-4"><h4 className="text-sm font-semibold text-red-700 mb-2">Their Strengths</h4><ul className="space-y-1">{bc.theirStrengths.map((s,i)=><li key={i} className="text-sm text-recast-gray-700">• {s}</li>)}</ul></div><div className="bg-green-50 rounded-lg p-4"><h4 className="text-sm font-semibold text-green-700 mb-2">Their Weaknesses</h4><ul className="space-y-1">{bc.theirWeaknesses.map((w,i)=><li key={i} className="text-sm text-recast-gray-700">• {w}</li>)}</ul></div><div className="bg-blue-50 rounded-lg p-4"><h4 className="text-sm font-semibold text-blue-700 mb-2">Our Differentiators</h4><ul className="space-y-1">{bc.ourDifferentiators.map((d,i)=><li key={i} className="text-sm text-recast-gray-700">• {d}</li>)}</ul></div><div className="bg-cyan-50 rounded-lg p-4"><h4 className="text-sm font-semibold text-cyan-700 mb-2">Win Strategy</h4><p className="text-sm text-recast-gray-700">{bc.winStrategy}</p></div></div></Card>)}</div>}{tab==='Objections'&&<div className="space-y-2">{objections.map(o=><div key={o.id} className="border border-recast-gray-200 rounded-lg overflow-hidden"><button onClick={()=>setOpenObj(openObj===o.id?null:o.id)} className="w-full flex items-center justify-between p-4 text-left hover:bg-recast-gray-50"><span className="font-medium text-recast-gray-800 pr-4">{o.objection}</span><svg className={`w-5 h-5 shrink-0 text-recast-gray-400 transition-transform ${openObj===o.id?'rotate-180':''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/></svg></button>{openObj===o.id&&<div className="px-4 pb-4 border-t border-recast-gray-100 pt-3 text-sm text-recast-gray-600">{o.response}</div>}</div>)}</div>}</div>}

Map[p.name]||'bg-recast-navy'}`}>{p.name[0]}</div><h3 className="text-lg font-semibold text-recast-navy mt-3">{p.name}</h3><p className="text-sm text-recast-gray-600 mt-1 line-clamp-3">{p.description}</p><Badge size="sm" className="mt-3">{p.resources.length} resources</Badge></Card></div>)}</div></div>}

// === DEALS ===
function DealsPage(){const{deals,addDeal,updateDeal}=useDeals();const[tab,setTab]=useState('Pipeline');const[showForm,setShowForm]=useState(false);const[selectedDeal,setSelectedDeal]=useState(null);const[search,setSearch]=useState('');const filtered=useMemo(()=>{if(!search.trim())return deals;const q=search.toLowerCase();return deals.filter(d=>d.customerName.toLowerCase().includes(q)||d.product.toLowerCase().includes(q))},[deals,search]);const fmt=v=>v>=1000?'$'+Math.round(v/1000)+'K':'$'+v;const fmtC=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:0}).format(v);const prodV={'Right Click Tools':'info','Application Workspace':'purple','Privileged Access':'warning'};const cols=[{key:'submitted',label:'Submitted',color:'border-amber-400 bg-amber-50'},{key:'approved',label:'Approved',color:'border-blue-400 bg-blue-50'},{key:'in_progress',label:'In Progress',color:'border-cyan-400 bg-cyan-50'},{key:'closed',label:'Closed',color:'border-green-400 bg-green-50'}];return <div className="space-y-6"><div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"><div><h1 className="text-2xl font-bold text-recast-navy">Deal Registration</h1><p className="text-sm text-recast-gray-500 mt-1">Manage and track your partner deals</p></div><Button onClick={()=>setShowForm(true)}>Register New Deal</Button></div><div className="flex flex-col sm:flex-row sm:items-center gap-4"><div className="flex gap-1 bg-recast-gray-100 rounded-lg p-1">{['Pipeline','Table'].map(t=><button key={t} onClick={()=>setTab(t)} className={`px-4 py-2 text-sm font-medium rounded-md transition-colors ${tab===t?'bg-white text-recast-navy shadow-sm':'text-recast-gray-600'}`}>{t}</button>)}</div><div className="flex-1 max-w-sm"><SearchInput value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search deals..."/></div></div>{tab==='Pipeline'&&<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">{cols.map(col=>{const cd=col.key==='closed'?filtered.filter(d=>d.status==='won'||d.status==='lost'):filtered.filter(d=>d.status===col.key);return <div key={col.key} className={`rounded-xl border-t-4 ${col.color} min-h-[200px]`}><div className="flex items-center justify-between p-3"><h3 className="text-sm font-semibold text-recast-navy">{col.label}</h3><Badge size="sm">{cd.length}</Badge></div><div className="px-3 pb-3 space-y-3">{cd.map(d=><div key={d.id} className="bg-white rounded-lg border border-recast-gray-200 p-3 hover:shadow-md transition-shadow cursor-pointer" onClick={()=>setSelectedDeal(d)}><p className="font-medium text-sm text-recast-navy">{d.customerName}</p><Badge variant={prodV[d.product]} size="sm">{d.product}</Badge><div className="flex justify-between mt-2"><span className="text-sm font-semibold">{fmt(d.estimatedValue)}</span><StatusPill status={d.status}/></div></div>)}{cd.length===0&&<p className="text-xs text-recast-gray-400 text-center py-4">No deals</p>}</div></div>})}</div>}{tab==='Table'&&<div className="overflow-x-auto bg-white rounded-xl border border-recast-gray-200"><table className="w-full"><thead><tr className="bg-recast-gray-50">{['Customer','Product','Value','Close Date','Status','Created'].map(h=><th key={h} className="text-left text-xs font-medium uppercase text-recast-gray-500 px-4 py-3">{h}</th>)}</tr></thead><tbody>{filtered.map(d=><tr key={d.id} onClick={()=>setSelectedDeal(d)} className="border-b border-recast-gray-200 cursor-pointer hover:bg-recast-gray-50"><td className="px-4 py-3 text-sm font-medium text-recast-navy">{d.customerName}</td><td className="px-4 py-3 text-sm">{d.product}</td><td className="px-4 py-3 text-sm">{fmtC(d.estimatedValue)}</td><td className="px-4 py-3 text-sm">{d.expectedCloseDate}</td><td className="px-4 py-3"><StatusPill status={d.status}/></td><td className="px-4 py-3 text-sm text-recast-gray-500">{new Date(d.createdAt).toLocaleDateString()}</td></tr>)}</tbody></table></div>}<Modal isOpen={showForm} onClose={()=>setShowForm(false)} title="Register New Deal" size="lg"><DealForm onSubmit={d=>{addDeal(d);setShowForm(false)}} onCancel={()=>setShowForm(false)}/></Modal>{selectedDeal&&<Modal isOpen={!!selectedDeal} onClose={()=>setSelectedDeal(null)} title="Deal Details" size="lg"><div className="grid grid-cols-2 gap-4"><div><p className="text-xs text-recast-gray-500 uppercase">Customer</p><p className="text-sm font-medium text-recast-navy mt-1">{selectedDeal.customerName}</p></div><div><p className="text-xs text-recast-gray-500 uppercase">Contact</p><p className="text-sm mt-1">{selectedDeal.customerContact||selectedDeal.customerEmail||'-'}</p></div><div><p className="text-xs text-recast-gray-500 uppercase">Product</p><p className="text-sm mt-1">{selectedDeal.product}</p></div><div><p className="text-xs text-recast-gray-500 uppercase">Value</p><p className="text-sm font-semibold mt-1">{fmtC(selectedDeal.estimatedValue)}</p></div><div className="col-span-2"><p className="text-xs text-recast-gray-500 uppercase">Notes</p><p className="text-sm mt-1">{selectedDeal.notes||'No notes'}</p></div><div><p className="text-xs text-recast-gray-500 uppercase">Status</p><div className="mt-1"><select value={selectedDeal.status} onChange={e=>{updateDeal(selectedDeal.id,{status:e.target.value});setSelectedDeal({...selectedDeal,status:e.target.value})}} className="rounded-lg border border-recast-gray-300 px-2 py-1 text-sm">{['submitted','approved','in_progress','won','lost'].map(s=><option key={s} value={s}>{s.replace(/_/g,' ')}</option>)}</select></div></div></div></Modal>}</div>}
function DealForm({onSubmit,onCancel}){const[f,setF]=useState({customerName:'',customerEmail:'',product:'Right Click Tools',estimatedValue:'',expectedCloseDate:'',notes:''});const[errors,setErrors]=useState({});const validate=()=>{const e={};if(!f.customerName.trim())e.customerName='Required';if(!f.customerEmail.trim())e.customerEmail='Required';if(!f.estimatedValue)e.estimatedValue='Required';if(!f.expectedCloseDate)e.expectedCloseDate='Required';return e};const handleSubmit=e=>{e.preventDefault();const errs=validate();if(Object.keys(errs).length){setErrors(errs);return}onSubmit({...f,estimatedValue:Number(f.estimatedValue),status:'submitted'})};const ic=field=>`w-full rounded-lg border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-recast-navy ${errors[field]?'border-red-500':'border-recast-gray-300'}`;return <form onSubmit={handleSubmit} className="space-y-4"><div><label className="block text-sm font-medium text-recast-gray-700 mb-1">Customer Name *</label><input value={f.customerName} onChange={e=>setF({...f,customerName:e.target.value})} className={ic('customerName')}/>{errors.customerName&&<p className="text-red-500 text-xs mt-1">{errors.customerName}</p>}</div><div><label className="block text-sm font-medium text-recast-gray-700 mb-1">Contact Email *</label><input type="email" value={f.customerEmail} onChange={e=>setF({...f,customerEmail:e.target.value})} className={ic('customerEmail')}/>{errors.customerEmail&&<p className="text-red-500 text-xs mt-1">{errors.customerEmail}</p>}</div><div><label className="block text-sm font-medium text-recast-gray-700 mb-1">Product</label><select value={f.product} onChange={e=>setF({...f,product:e.target.value})} className="w-full rounded-lg border border-recast-gray-300 px-3 py-2 text-sm"><option>Right Click Tools</option><option>Application Workspace</option><option>Privileged Access</option></select></div><div><label className="block text-sm font-medium text-recast-gray-700 mb-1">Estimated Value *</label><div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-recast-gray-500">$</span><input type="number" value={f.estimatedValue} onChange={e=>setF({...f,estimatedValue:e.target.value})} className={`${ic('estimatedValue')} pl-7`} min="0"/></div></div><div><label className="block text-sm font-medium text-recast-gray-700 mb-1">Expected Close Date *</label><input type="date" value={f.expectedCloseDate} onChange={e=>setF({...f,expectedCloseDate:e.target.value})} className={ic('expectedCloseDate')}/></div><div><label className="block text-sm font-medium text-recast-gray-700 mb-1">Notes</label><textarea value={f.notes} onChange={e=>setF({...f,notes:e.target.value})} rows={3} className="w-full rounded-lg border border-recast-gray-300 px-3 py-2 text-sm"/></div><div className="flex justify-end gap-3 pt-2"><Button variant="secondary" onClick={onCancel}>Cancel</Button><Button type="submit">Register Deal</Button></div></form>}

function MarketingPage(){const[cat,setCat]=useState('all');const[search,setSearch]=useState('');const[selected,setSelected]=useState(null);const cats=[{key:'all',label:'All'},{key:'email_template',label:'Email Templates'},{key:'social_media',label:'Social Media'},{key:'co_branded',label:'Co-branded'},{key:'campaign',label:'Campaigns'},{key:'event',label:'Events'}];const catLabel={email_template:'Email Template',social_media:'Social Media',co_branded:'Co-branded',campaign:'Campaign',event:'Event'};const grad={email_template:'from-blue-400 to-blue-600',social_media:'from-purple-400 to-purple-600',co_branded:'from-cyan-400 to-cyan-600',campaign:'from-orange-400 to-orange-600',event:'from-green-400 to-green-600'};const filtered=useMemo(()=>{let r=marketingAssets;if(cat!=='all')r=r.filter(a=>a.category===cat);if(search.trim()){const q=search.toLowerCase();r=r.filter(a=>a.title.toLowerCase().includes(q)||a.description.toLowerCase().includes(q))}return r},[cat,search]);return <div className="space-y-6"><div><h1 className="text-2xl font-bold text-recast-navy">Marketing Materials</h1><p className="text-sm text-recast-gray-500 mt-1">Co-branded marketing assets</p></div><div className="flex gap-2 overflow-x-auto pb-2">{cats.map(c=><button key={c.key} onClick={()=>setCat(c.key)} className={`whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-colors ${cat===c.key?'bg-recast-navy text-white':'bg-recast-gray-100 text-recast-gray-600 hover:bg-recast-gray-200'}`}>{c.label}</button>)}</div><div className="max-w-sm"><SearchInput value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search assets..."/></div><div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{filtered.map(a=><div key={a.id} onClick={()=>setSelected(a)} className="bg-white rounded-xl border border-recast-gray-200 overflow-hidden cursor-pointer hover:shadow-md transition-shadow"><div className={`h-32 bg-gradient-to-br ${grad[a.category]||'from-gray-400 to-gray-600'} flex items-center justify-center`}><span className="text-white/80 text-2xl font-bold uppercase">{a.format}</span></div><div className="p-4"><h3 className="text-sm font-semibold text-recast-navy">{a.title}</h3><p className="text-xs text-recast-gray-500 mt-1 line-clamp-2">{a.description}</p><div className="flex gap-2 mt-3"><Badge size="sm">{a.format}</Badge><Badge size="sm">{catLabel[a.category]}</Badge></div></div></div>)}{filtered.length===0&&<p className="col-span-full text-center py-8 text-sm text-recast-gray-400">No assets found</p>}</div>{selected&&<Modal isOpen={!!selected} onClose={()=>setSelected(null)} title={selected.title} size="lg"><div className={`h-48 rounded-lg bg-gradient-to-br ${grad[selected.category]} flex items-center justify-center mb-4`}><span className="text-white/80 text-4xl font-bold uppercase">{selected.format}</span></div><p className="text-sm text-recast-gray-700 mb-4">{selected.description}</p><div className="grid grid-cols-3 gap-4 text-sm"><div><p className="text-xs text-recast-gray-500 uppercase">Category</p><p className="mt-1">{catLabel[selected.category]}</p></div><div><p className="text-xs text-recast-gray-500 uppercase">Format</p><p className="mt-1">{selected.format}</p></div><div><p className="text-xs text-recast-gray-500 uppercase">Product</p><p className="mt-1">{selected.product}</p></div></div><div className="flex justify-end gap-3 mt-6 pt-4 border-t"><Button variant="secondary" onClick={()=>setSelected(null)}>Close</Button><Button onClick={()=>alert('Download started!')}>Download Asset</Button></div></Modal>}</div>}

// === TRAINING ===
function TrainingPage(){const[completedIds,setCompletedIds]=useLocalStorage('recast-training',[]);const[tab,setTab]=useState('Paths');const[selectedPath,setSelectedPath]=useState(null);const toggle=id=>setCompletedIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);const totalMods=learningPaths.reduce((s,p)=>s+p.modules.length,0);const totalDone=completedIds.length;const pct=totalMods?Math.round(totalDone/totalMods*100):0;if(selectedPath){const path=learningPaths.find(p=>p.id===selectedPath);if(!path)return null;return <div className="space-y-6"><Button variant="ghost" size="sm" onClick={()=>setSelectedPath(null)}>← Back</Button><h2 className="text-xl font-bold text-recast-navy">{path.title}</h2><p className="text-sm text-recast-gray-500">{path.description}</p><div className="space-y-3">{[...path.modules].sort((a,b)=>a.order-b.order).map(m=>{const done=completedIds.includes(m.id);return <div key={m.id} className={`flex items-start gap-4 p-4 rounded-lg border ${done?'border-green-200 bg-green-50/50':'border-recast-gray-200 bg-white'}`}><button onClick={()=>toggle(m.id)} className={`mt-0.5 w-5 h-5 rounded border-2 flex items-center justify-center ${done?'bg-green-500 border-green-500 text-white':'border-recast-gray-300'}`}>{done&&<svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>}</button><div className="flex-1"><div className="flex items-center gap-2"><h4 className={`text-sm font-semibold ${done?'text-recast-gray-400 line-through':'text-recast-navy'}`}>{m.title}</h4><Badge variant={m.type==='video'?'info':m.type==='quiz'?'purple':'default'} size="sm">{m.type}</Badge></div><p className={`text-sm mt-1 ${done?'text-recast-gray-400':'text-recast-gray-500'}`}>{m.description}</p><p className="text-xs text-recast-gray-400 mt-1">{m.durationMinutes} min</p></div></div>})}</div></div>}return <div className="space-y-6"><div><h1 className="text-2xl font-bold text-recast-navy">Training & Certification</h1><p className="text-sm text-recast-gray-500 mt-1">Build your skills and earn certifications</p></div><Card title="Training Progress"><div className="mb-4"><div className="flex justify-between mb-2"><span className="text-sm text-recast-gray-600">Overall Completion</span><span className="text-sm font-semibold text-recast-navy">{totalDone}/{totalMods} modules</span></div><ProgressBar value={pct} color="green" showLabel/></div></Card><div className="flex gap-2">{['Paths','Certifications'].map(t=><button key={t} onClick={()=>setTab(t)} className={`px-4 py-2 rounded-lg text-sm font-medium ${tab===t?'bg-recast-navy text-white':'bg-recast-gray-100 text-recast-gray-600'}`}>{t}</button>)}</div>{tab==='Paths'&&<div className="grid grid-cols-1 md:grid-cols-3 gap-6">{learningPaths.map(path=>{const done=path.modules.filter(m=>completedIds.includes(m.id)).length;const pp=path.modules.length?Math.round(done/path.modules.length*100):0;return <Card key={path.id}><h4 className="text-lg font-semibold text-recast-navy mb-2">{path.title}</h4><p className="text-sm text-recast-gray-500 mb-4 line-clamp-2">{path.description}</p><p className="text-xs text-recast-gray-400 mb-3">{path.modules.length} modules</p><ProgressBar value={pp} color="green" showLabel/><Button variant={done>0?'primary':'secondary'} size="sm" onClick={()=>setSelectedPath(path.id)} className="w-full mt-4">{done>0?'Continue':'Start'}</Button></Card>})}</div>}{tab==='Certifications'&&<div className="grid grid-cols-1 md:grid-cols-3 gap-6">{certifications.map(c=>{const path=learningPaths.find(p=>p.id===c.pathId);const done=path?path.modules.filter(m=>completedIds.includes(m.id)).length:0;const total=path?path.modules.length:0;const pp=total?Math.round(done/total*100):0;const isEarned=pp===100;return <Card key={c.id}><div className="flex items-start justify-between mb-3"><h4 className="font-semibold text-recast-navy pr-4">{c.title}</h4><StatusPill status={isEarned?'earned':done>0?'in_progress':'not_started'}/></div><p className="text-sm text-recast-gray-500 mb-3">{c.description}</p>{isEarned?<div className="flex items-center gap-2 text-green-600"><svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span className="text-sm font-medium">Earned</span></div>:<ProgressBar value={pp} color="cyan" size="sm" showLabel/>}</Card>})}</div>}</div>}

// === INCENTIVES ===
function IncentivesPage(){const{user}=useAuth();const currentTier=user?.tier||'Gold';const tierOrder=['Registered','Silver','Gold','Platinum'];const tierColor={Registered:{border:'border-gray-400',bg:'bg-gray-50',badge:'default'},Silver:{border:'border-slate-400',bg:'bg-slate-50',badge:'default'},Gold:{border:'border-amber-400',bg:'bg-amber-50',badge:'warning'},Platinum:{border:'border-purple-400',bg:'bg-purple-50',badge:'purple'}};const ci=tierOrder.indexOf(currentTier);const trophyC=['#F59E0B','#9CA3AF','#CD7F32'];return <div className="space-y-6"><div><h1 className="text-2xl font-bold text-recast-navy">Incentives & Rewards</h1><p className="text-sm text-recast-gray-500 mt-1">Track tier progression, MDF, and rebates</p></div><div className="bg-white rounded-xl shadow-sm border border-recast-gray-200 p-5"><h3 className="text-lg font-semibold text-recast-navy mb-4">Partner Tier Progression</h3><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">{tiers.map(t=>{const idx=tierOrder.indexOf(t.name);const isCur=t.name===currentTier;const isAbove=idx>ci;const tc=tierColor[t.name]||tierColor.Registered;return <div key={t.id} className={`relative rounded-lg border-2 p-4 ${isCur?`${tc.border} ${tc.bg} ring-2 ring-offset-1`:'border-recast-gray-200'}`}>{isCur&&<div className="absolute -top-2.5 left-3"><Badge variant={tc.badge} size="sm">Current</Badge></div>}{isAbove&&<div className="absolute -top-2.5 left-3"><Badge variant="info" size="sm">Next</Badge></div>}<div className="mt-1"><h4 className="font-bold text-recast-navy">{t.name}</h4><p className="text-lg font-semibold text-recast-gray-700 mt-1">{t.discount} discount</p><p className="text-xs text-recast-gray-500 mt-2">{t.requirements}</p></div></div>})}</div></div><div className="grid grid-cols-1 lg:grid-cols-2 gap-6"><Card title="Market Development Funds"><div className="grid grid-cols-3 gap-4 mb-6"><div className="text-center"><p className="text-2xl font-bold text-recast-navy">${mdfData.balance.toLocaleString()}</p><p className="text-xs text-recast-gray-500 mt-1">Balance</p></div><div className="text-center"><p className="text-2xl font-bold text-amber-600">${mdfData.pending.toLocaleString()}</p><p className="text-xs text-recast-gray-500 mt-1">Pending</p></div><div className="text-center"><p className="text-2xl font-bold text-green-600">${mdfData.approved.toLocaleString()}</p><p className="text-xs text-recast-gray-500 mt-1">Approved</p></div></div><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="border-b">{['Date','Description','Amount','Status'].map(h=><th key={h} className="text-left py-2 text-xs uppercase text-recast-gray-500">{h}</th>)}</tr></thead><tbody>{mdfData.claims.map(c=><tr key={c.id} className="border-b border-recast-gray-100"><td className="py-3 text-recast-gray-600">{c.date}</td><td className="py-3">{c.description}</td><td className="py-3 font-medium">${c.amount.toLocaleString()}</td><td className="py-3"><StatusPill status={c.status}/></td></tr>)}</tbody></table></div></Card><Card title="Rebate Summary"><div className="mb-4 flex items-center gap-4"><div><span className="text-sm text-recast-gray-500">Tier:</span> <span className="font-semibold text-recast-navy">{rebateData.currentTier}</span></div><div><span className="text-sm text-recast-gray-500">Rate:</span> <span className="font-semibold text-recast-navy">{rebateData.rate}</span></div></div><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="border-b">{['Quarter','Revenue','Rebate','Status'].map(h=><th key={h} className="text-left py-2 text-xs uppercase text-recast-gray-500">{h}</th>)}</tr></thead><tbody>{rebateData.quarters.map((q,i)=><tr key={i} className="border-b border-recast-gray-100"><td className="py-3 font-medium">{q.quarter}</td><td className="py-3">${q.revenue.toLocaleString()}</td><td className="py-3 font-medium text-recast-green">${q.rebate.toLocaleString()}</td><td className="py-3"><StatusPill status={q.status}/></td></tr>)}</tbody></table></div></Card></div><Card title="Top Partners"><div className="space-y-3">{leaderboard.map((e,i)=>{const isMe=e.company===user?.company;const w=Math.min(100,e.revenue/leaderboard[0].revenue*100);return <div key={e.rank} className={`flex items-center gap-3 p-2 rounded-lg ${isMe?'bg-recast-navy/5 ring-1 ring-recast-navy/20':''}`}><span className="w-6 text-center text-sm font-bold">{i<3?<span style={{color:trophyC[i]}} className="text-lg">●</span>:<span className="text-recast-gray-400">{e.rank}</span>}</span><span className={`text-sm w-40 shrink-0 truncate ${isMe?'font-bold text-recast-navy':'text-recast-gray-600'}`}>{e.company}{isMe&&<span className="ml-1 text-xs text-recast-gray-400">(You)</span>}</span><div className="flex-1 bg-recast-gray-200 rounded-full h-5"><div className="h-5 rounded-full transition-all" style={{width:w+'%',backgroundColor:i<3?trophyC[i]:isMe?'#161f5b':'#6B7280'}}/></div><span className="text-sm font-medium w-16 text-right">${(e.revenue/1000).toFixed(0)}K</span></div>})}</div></Card></div>}

// === SUPPORT ===
function SupportPage(){const{tickets,addTicket}=useTickets();const[tab,setTab]=useState('tickets');const[showForm,setShowForm]=useState(false);const[selected,setSelected]=useState(null);const[filter,setFilter]=useState('All');const[openFaq,setOpenFaq]=useState(null);const catV={deal_support:'info',technical:'purple',billing:'warning',general:'default'};const catL={deal_support:'Deal Support',technical:'Technical',billing:'Billing',general:'General'};const priV={high:'danger',medium:'warning',low:'default'};const filtered=filter==='All'?tickets:tickets.filter(t=>t.status===filter);return <div className="space-y-6"><div><h1 className="text-2xl font-bold text-recast-navy">Support & Contact</h1><p className="text-sm text-recast-gray-500 mt-1">Get help and find answers</p></div><div className="grid grid-cols-1 lg:grid-cols-3 gap-6"><div className="lg:col-span-2 space-y-4"><div className="flex items-center justify-between"><div className="flex gap-2">{['tickets','faq'].map(t=><button key={t} onClick={()=>setTab(t)} className={`px-4 py-2 rounded-lg text-sm font-medium ${tab===t?'bg-recast-navy text-white':'bg-recast-gray-100 text-recast-gray-600'}`}>{t==='tickets'?'Tickets':'FAQ'}</button>)}</div>{tab==='tickets'&&<Button size="sm" onClick={()=>setShowForm(true)}>New Ticket</Button>}</div><Card>{tab==='tickets'?<div><div className="flex gap-1 bg-recast-gray-100 rounded-lg p-1 mb-4 w-fit">{['All','open','in_progress','resolved'].map(f=><button key={f} onClick={()=>setFilter(f)} className={`px-3 py-1.5 text-sm font-medium rounded-md ${filter===f?'bg-white text-recast-navy shadow-sm':'text-recast-gray-600'}`}>{f==='All'?'All':f.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</button>)}</div>{filtered.length===0?<p className="text-sm text-recast-gray-500 py-8 text-center">No tickets</p>:<div className="space-y-3">{filtered.map(t=><div key={t.id} onClick={()=>setSelected(t)} className="border border-recast-gray-200 rounded-lg p-4 hover:bg-recast-gray-50 cursor-pointer"><div className="flex items-start justify-between mb-2"><h4 className="text-sm font-semibold text-recast-navy">{t.subject}</h4><StatusPill status={t.status}/></div><div className="flex items-center gap-2 flex-wrap"><Badge variant={catV[t.category]} size="sm">{catL[t.category]||t.category}</Badge><Badge variant={priV[t.priority]} size="sm">{t.priority}</Badge><span className="text-xs text-recast-gray-400 ml-auto">{new Date(t.createdAt).toLocaleDateString()}</span></div></div>)}</div>}</div>:<div className="space-y-2">{faqs.map(f=><div key={f.id} className="border border-recast-gray-200 rounded-lg"><button onClick={()=>setOpenFaq(openFaq===f.id?null:f.id)} className="w-full flex items-center justify-between p-4 text-left hover:bg-recast-gray-50"><span className="text-sm font-medium text-recast-navy pr-4">{f.question}</span><svg className={`w-5 h-5 shrink-0 text-recast-gray-400 transition-transform ${openFaq===f.id?'rotate-180':''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/></svg></button>{openFaq===f.id&&<div className="px-4 pb-4 border-t pt-3 text-sm text-recast-gray-600">{f.answer}</div>}</div>)}</div>}</Card></div><Card title="Your Partner Manager"><div className="text-center"><div className="w-16 h-16 rounded-full bg-recast-navy flex items-center justify-center text-white text-xl font-bold mx-auto mb-3">{partnerManager.initials}</div><h4 className="font-bold text-recast-navy">{partnerManager.name}</h4><p className="text-sm text-recast-gray-500 mt-0.5">{partnerManager.title}</p><div className="mt-4 space-y-2 text-sm"><p className="text-recast-gray-600"><a href={`mailto:${partnerManager.email}`} className="text-recast-navy hover:underline">{partnerManager.email}</a></p><p className="text-recast-gray-600">{partnerManager.phone}</p></div><Button variant="primary" size="md" className="w-full mt-5" onClick={()=>window.open(partnerManager.calendlyLink||'#','_blank')}>Schedule a Call</Button></div></Card></div><Modal isOpen={showForm} onClose={()=>setShowForm(false)} title="Submit a Ticket"><TicketFormInline onSubmit={f=>{addTicket({...f,status:'open'});setShowForm(false)}} onCancel={()=>setShowForm(false)}/></Modal>{selected&&<Modal isOpen={!!selected} onClose={()=>setSelected(null)} title="Ticket Details"><div className="space-y-4"><div><p className="text-xs uppercase text-recast-gray-500">Subject</p><p className="font-medium">{selected.subject}</p></div><div className="grid grid-cols-3 gap-4"><div><p className="text-xs uppercase text-recast-gray-500">Category</p><p className="text-sm capitalize">{(selected.category||'').replace(/_/g,' ')}</p></div><div><p className="text-xs uppercase text-recast-gray-500">Priority</p><p className="text-sm capitalize">{selected.priority}</p></div><div><p className="text-xs uppercase text-recast-gray-500">Status</p><StatusPill status={selected.status}/></div></div><div><p className="text-xs uppercase text-recast-gray-500">Description</p><p className="text-sm text-recast-gray-600 mt-1">{selected.description}</p></div></div></Modal>}</div>}
function TicketFormInline({onSubmit,onCancel}){const[f,setF]=useState({subject:'',category:'general',priority:'medium',description:''});const[errors,setErrors]=useState({});const handle=e=>{e.preventDefault();const er={};if(!f.subject.trim())er.subject='Required';if(!f.description.trim())er.description='Required';if(Object.keys(er).length){setErrors(er);return}onSubmit(f)};return <form onSubmit={handle} className="space-y-4"><div><label className="block text-sm font-medium text-recast-gray-700 mb-1">Subject *</label><input value={f.subject} onChange={e=>setF({...f,subject:e.target.value})} className={`w-full rounded-lg border px-3 py-2 text-sm ${errors.subject?'border-red-500':'border-recast-gray-300'}`}/>{errors.subject&&<p className="text-xs text-red-600 mt-1">{errors.subject}</p>}</div><div className="grid grid-cols-2 gap-4"><div><label className="block text-sm font-medium text-recast-gray-700 mb-1">Category</label><select value={f.category} onChange={e=>setF({...f,category:e.target.value})} className="w-full rounded-lg border border-recast-gray-300 px-3 py-2 text-sm"><option value="general">General</option><option value="deal_support">Deal Support</option><option value="technical">Technical</option><option value="billing">Billing</option></select></div><div><label className="block text-sm font-medium text-recast-gray-700 mb-1">Priority</label><select value={f.priority} onChange={e=>setF({...f,priority:e.target.value})} className="w-full rounded-lg border border-recast-gray-300 px-3 py-2 text-sm"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div></div><div><label className="block text-sm font-medium text-recast-gray-700 mb-1">Description *</label><textarea value={f.description} onChange={e=>setF({...f,description:e.target.value})} rows={4} className={`w-full rounded-lg border px-3 py-2 text-sm ${errors.description?'border-red-500':'border-recast-gray-300'}`}/>{errors.description&&<p className="text-xs text-red-600 mt-1">{errors.description}</p>}</div><div className="flex justify-end gap-3"><Button variant="secondary" onClick={onCancel}>Cancel</Button><Button type="submit">Submit</Button></div></form>}

// === APP ===
const PAGES={'/':<DashboardPage/>,'/playbooks':<PlaybooksPage/>,'/products':<ProductsPage/>,'/deals':<DealsPage/>,'/marketing':<MarketingPage/>,'/training':<TrainingPage/>,'/incentives':<IncentivesPage/>,'/support':<SupportPage/>};

function App(){const{user,loading}=useAuth();const hash=useHash();if(loading)return null;if(!user&&hash!=='/login'){navigate('/login');return null}if(user&&hash==='/login'){navigate('/');return null}if(hash==='/login')return <LoginPage/>;const base='/'+hash.split('/').filter(Boolean)[0];const page=PAGES[hash]||PAGES[base]||<DashboardPage/>;return <AppLayout>{page}</AppLayout>}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthProvider><App/></AuthProvider>);
</script>
</body>
</html>
