<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Second Brain - Side Panel</title>
  <link rel="stylesheet" href="../styles/sidepanel.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>Second Brain</h1>
      <div class="header-actions">
        <button id="btn-new-recording" class="icon-btn" title="New Recording">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Search -->
    <div class="search-container">
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search" placeholder="Search your knowledge base..." />
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="stat-notes">0</span>
        <span class="stat-label">Notes</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-topics">0</span>
        <span class="stat-label">Topics</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-actions">0</span>
        <span class="stat-label">Actions</span>
      </div>
    </div>

    <!-- Content Area -->
    <div id="content" class="content">
      <!-- Dynamically populated -->
    </div>

    <!-- Chat Quick Access -->
    <div class="chat-quick">
      <input type="text" id="quick-chat" placeholder="Ask your Second Brain anything..." />
      <button id="btn-quick-send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
